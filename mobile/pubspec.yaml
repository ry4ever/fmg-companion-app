name: fmg_companion
description: Football Mind Gym Companion - "My Gym" experience
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^2.27.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.15.0
  go_router: ^14.0.0
  hive: ^2.2.2
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+3
  video_player: ^2.8.2
  wakelock_plus: ^1.2.1
  percent_indicator: ^4.2.3
  font_awesome_flutter: ^10.8.0
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/audio/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Medium.ttf
        - asset: fonts/Poppins-Bold.ttf
          weight: 700